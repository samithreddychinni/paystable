name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          skip-cache: true

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paystable
          POSTGRES_PASSWORD: paystable
          POSTGRES_DB: paystable_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U paystable"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go test -race -coverprofile=coverage.out ./...
        env:
          DATABASE_URL: postgres://paystable:paystable@localhost:5432/paystable_test?sslmode=disable
      - uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage.out

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        working-directory: dashboard
      - run: npm run lint
        working-directory: dashboard
      - run: npm run build
        working-directory: dashboard

  laboratory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Start the Docker laboratory
        run: docker compose -f docker-compose.lab.yml up --build -d
      - name: Verify network, security, and concurrency faults
        run: |
          go run ./testkit/labexec testkit/lab/scenarios/new-key-after-timeout.json /tmp/timeout.json INV-2
          go run ./testkit/labexec testkit/lab/scenarios/new-key-after-connection-reset.json /tmp/reset.json INV-2
          go run ./testkit/labexec testkit/lab/scenarios/new-key-after-server-error.json /tmp/server-error.json INV-2
          go run ./testkit/labexec testkit/lab/scenarios/invalid-signature.json /tmp/invalid-signature.json INV-SEC-1
          go run ./testkit/labexec testkit/lab/scenarios/tampered-body.json /tmp/tampered-body.json INV-SEC-1
          go run ./testkit/labexec testkit/lab/scenarios/correct-security.json /tmp/correct-security.json
          go run ./testkit/labexec testkit/lab/scenarios/concurrent-claim.json /tmp/concurrent-claim.json INV-2
          go run ./testkit/labexec testkit/lab/scenarios/correct-concurrency.json /tmp/correct-concurrency.json
      - name: Stop the Docker laboratory
        if: always()
        run: docker compose -f docker-compose.lab.yml down

  build:
    runs-on: ubuntu-latest
    needs: [lint, test, dashboard, laboratory]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - run: go build -o paystable ./cmd/paystable
      - run: docker build -t paystable:ci .
